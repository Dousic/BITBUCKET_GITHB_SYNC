<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Dousic — Universal Media Platform for Creators on LG webOS" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!--
      Content Security Policy (production)
      ------------------------------------
      Enact apps run under file:// on webOS, so 'self' resolves to the app's
      own origin.

      connect-src uses subdomain wildcards on dousic.media for the REST API,
      pairing flow, and Reverb WebSocket. Wildcards are CSP-spec-compliant
      and match webOS's Chromium engine — they let us point at any current
      or future subdomain (api, staging, ws, auth, pair, ...) without
      revisiting CSP on every backend route addition.

      'unsafe-eval' is removed — React 18 production builds do not eval
      strings at runtime. Enact's dev server needs it, but `enact pack -p`
      does not. Re-add it ONLY if a runtime regression surfaces and you
      have time to QA a separate dev template.

      script-src is 'self' only — there are NO inline <script> tags (the
      splash is hidden from the bundled index.js, not an inline script), so
      'unsafe-inline' is unnecessary and is omitted. LG cert flags
      'unsafe-inline' in script-src on manual review. style-src keeps
      'unsafe-inline' because the splash <style> block and Moonstone's
      runtime style injection require it.

      `*.dousic-cdn.com` is a placeholder for the production HLS CDN host.
      Confirm with the streaming team before LG submission; if the CDN
      lives at a different domain (e.g. CloudFront, BunnyCDN), update
      this directive or playback will be CSP-blocked.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
               script-src 'self';
               connect-src 'self'
                 https://dousic.media
                 https://*.dousic.media
                 wss://*.dousic.media
                 https://*.dousic-cdn.com;
               img-src 'self' https: data: blob:;
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               media-src 'self' https: blob:;
               frame-src 'none';
               object-src 'none';
               base-uri 'self';" />

    <title>Dousic</title>

    <!--
      Inline splash — visible within ~100ms on a 2019 TV.
      Hides automatically when Enact mounts content into #root.
    -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: #0F0309;
            color: #F4F1F7;
            font-family: 'Poppins', 'LG Smart UI', 'Museo Sans', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        #dousic-splash {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: radial-gradient(ellipse at center, #2B0716 0%, #0F0309 72%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 400ms ease-out;
        }

        #dousic-splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        #dousic-splash .mark-img {
            width: min(560px, 42vw);
            height: auto;
            display: block;
            filter: drop-shadow(0 12px 48px rgba(221, 28, 120, 0.45));
        }

        #dousic-splash .tagline {
            margin-top: 16px;
            font-size: 24px;
            color: #948D9C;
            letter-spacing: 0.02em;
        }

        #dousic-splash .pulse-ring {
            margin-top: 64px;
            width: 64px;
            height: 64px;
            border: 3px solid rgba(221, 28, 120, 0.3);
            border-top-color: #DD1C78;
            border-radius: 50%;
            animation: dousic-spin 900ms linear infinite;
        }

        @keyframes dousic-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
